name: Build Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:win -- x64
      - uses: actions/upload-artifact@v4
        with:
          name: ZhizhiCompanion-windows-x64
          path: dist/ChatGPT Companion-win32-x64/
          if-no-files-found: error
